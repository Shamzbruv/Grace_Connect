plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def readMapsApiKey = { platform ->
    def platformKeyName = "GOOGLE_MAPS_API_KEY_${platform}"
    def sharedKeyName = "GOOGLE_MAPS_API_KEY"
    return project.findProperty(platformKeyName)
            ?: localProperties.getProperty(platformKeyName)
            ?: System.getenv(platformKeyName)
            ?: project.findProperty(sharedKeyName)
            ?: localProperties.getProperty(sharedKeyName)
            ?: System.getenv(sharedKeyName)
            ?: ""
}

android {
    namespace "com.example.grace_connect"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.grace_connect"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 10
        versionName "1.0.9-beta"
        multiDexEnabled true
        manifestPlaceholders = [
            googleMapsApiKey: readMapsApiKey("ANDROID"),
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase (BOM controls versions)
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
}
