plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def readMapsApiKey = { platform ->
    def platformKeyName = "GOOGLE_MAPS_API_KEY_${platform}"
    def sharedKeyName = "GOOGLE_MAPS_API_KEY"
    return project.findProperty(platformKeyName)
            ?: localProperties.getProperty(platformKeyName)
            ?: System.getenv(platformKeyName)
            ?: project.findProperty(sharedKeyName)
            ?: localProperties.getProperty(sharedKeyName)
            ?: System.getenv(sharedKeyName)
            ?: ""
}

def readConfigValue = { name, defaultValue = "" ->
    return project.findProperty(name)
            ?: localProperties.getProperty(name)
            ?: System.getenv(name)
            ?: defaultValue
}

def graceConnectApplicationId = readConfigValue("GRACE_CONNECT_APPLICATION_ID", "love.graceconnect")
def releaseStoreFile = readConfigValue("GRACE_CONNECT_UPLOAD_STORE_FILE")
def releaseStorePassword = readConfigValue("GRACE_CONNECT_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = readConfigValue("GRACE_CONNECT_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = readConfigValue("GRACE_CONNECT_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

if (isReleaseTaskRequested) {
    if (graceConnectApplicationId != "love.graceconnect") {
        throw new GradleException("Release builds must use the final Play package id love.graceconnect.")
    }
    if (!hasReleaseSigning) {
        throw new GradleException("Set GRACE_CONNECT_UPLOAD_STORE_FILE, GRACE_CONNECT_UPLOAD_STORE_PASSWORD, GRACE_CONNECT_UPLOAD_KEY_ALIAS, and GRACE_CONNECT_UPLOAD_KEY_PASSWORD before building a release.")
    }
}

android {
    namespace "love.graceconnect"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId graceConnectApplicationId
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 17
        versionName "1.0.16-beta"
        multiDexEnabled true
        manifestPlaceholders = [
            googleMapsApiKey: readMapsApiKey("ANDROID"),
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase (BOM controls versions)
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
}
