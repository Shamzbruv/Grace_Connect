plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def normalizeConfigValue = { value ->
    return value == null ? "" : value.toString().trim()
}

def findConfigValue = { name ->
    def keyName = name.toString()
    if (project.hasProperty(keyName)) {
        return normalizeConfigValue(project.property(keyName))
    }
    if (localProperties.containsKey(keyName)) {
        return normalizeConfigValue(localProperties.getProperty(keyName))
    }
    def envValue = System.getenv(keyName)
    if (envValue != null) {
        return normalizeConfigValue(envValue)
    }
    return null
}

def readFirstConfigValue = { names, defaultValue = "" ->
    for (name in names) {
        def configuredValue = findConfigValue(name)
        if (configuredValue != null) {
            return configuredValue
        }
    }
    return normalizeConfigValue(defaultValue)
}

def readMapsApiKey = { platform ->
    def platformKeyName = "GOOGLE_MAPS_API_KEY_${platform}"
    def sharedKeyName = "GOOGLE_MAPS_API_KEY"
    return readFirstConfigValue([platformKeyName, sharedKeyName])
}

def readConfigValue = { name, defaultValue = "" ->
    return readFirstConfigValue([name], defaultValue)
}

def configuredGraceConnectApplicationId = readConfigValue("GRACE_CONNECT_APPLICATION_ID")
def graceConnectApplicationId = configuredGraceConnectApplicationId ?: "love.graceconnect"
def androidMapsApiKey = readMapsApiKey("ANDROID")
def androidMapsApiKeyFromAndroidProperty =
        readConfigValue("GOOGLE_MAPS_API_KEY_ANDROID")
def releaseStoreFile = readConfigValue("GRACE_CONNECT_UPLOAD_STORE_FILE")
def releaseStorePassword = readConfigValue("GRACE_CONNECT_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = readConfigValue("GRACE_CONNECT_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = readConfigValue("GRACE_CONNECT_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

if (isReleaseTaskRequested) {
    if (configuredGraceConnectApplicationId != "love.graceconnect") {
        throw new GradleException("Set GRACE_CONNECT_APPLICATION_ID=love.graceconnect before building a release.")
    }
    if (!androidMapsApiKeyFromAndroidProperty) {
        throw new GradleException("Set GOOGLE_MAPS_API_KEY_ANDROID before building a release. This value feeds the googleMapsApiKey manifest placeholder for com.google.android.geo.API_KEY; do not commit the secret.")
    }
    if (!androidMapsApiKey) {
        throw new GradleException("Android release manifest placeholder googleMapsApiKey is blank. Set GOOGLE_MAPS_API_KEY_ANDROID before building a release.")
    }
    if (!hasReleaseSigning) {
        throw new GradleException("Set GRACE_CONNECT_UPLOAD_STORE_FILE, GRACE_CONNECT_UPLOAD_STORE_PASSWORD, GRACE_CONNECT_UPLOAD_KEY_ALIAS, and GRACE_CONNECT_UPLOAD_KEY_PASSWORD before building a release.")
    }
}

android {
    namespace "love.graceconnect"
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId graceConnectApplicationId
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 26
        versionName "1.0.24-beta"
        multiDexEnabled true
        manifestPlaceholders = [
            googleMapsApiKey: androidMapsApiKey,
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Firebase (BOM controls versions)
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
}

tasks.register("validateGraceReleaseConfig") {
    group = "verification"
    description = "Validates Grace Connect Android release package id, signing, and Maps manifest placeholder."

    doLast {
        if (configuredGraceConnectApplicationId != "love.graceconnect") {
            throw new GradleException("Set GRACE_CONNECT_APPLICATION_ID=love.graceconnect before building a release.")
        }
        if (!androidMapsApiKeyFromAndroidProperty) {
            throw new GradleException("Set GOOGLE_MAPS_API_KEY_ANDROID before building a release. This value feeds the googleMapsApiKey manifest placeholder for com.google.android.geo.API_KEY; do not commit the secret.")
        }
        def placeholderValue = normalizeConfigValue(
                android.defaultConfig.manifestPlaceholders.googleMapsApiKey
        )
        if (!placeholderValue) {
            throw new GradleException("Android release manifest placeholder googleMapsApiKey is blank. Set GOOGLE_MAPS_API_KEY_ANDROID before building a release.")
        }
        if (!hasReleaseSigning) {
            throw new GradleException("Set GRACE_CONNECT_UPLOAD_STORE_FILE, GRACE_CONNECT_UPLOAD_STORE_PASSWORD, GRACE_CONNECT_UPLOAD_KEY_ALIAS, and GRACE_CONNECT_UPLOAD_KEY_PASSWORD before building a release.")
        }
    }
}

gradle.projectsEvaluated {
    tasks.matching { task ->
        ["assembleRelease", "bundleRelease", "processReleaseMainManifest"].contains(task.name)
    }.configureEach {
        dependsOn("validateGraceReleaseConfig")
    }
}
