name: grace_connect
description: "Grace Connect - Church Management System"
version: "1.0.13-beta+14"
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  font_awesome_flutter: ^10.8.0
  provider: ^6.1.2
  firebase_core: 2.32.0
  firebase_core_web: 2.18.1
  firebase_analytics: 10.10.7
  firebase_crashlytics: 3.5.7
  google_sign_in: 6.2.1
  shared_preferences: ^2.2.2
  firebase_messaging: 14.7.10
  flutter_local_notifications: ^19.4.0
  google_sign_in_ios: 5.7.8
  http: ^1.4.0
  stop_watch_timer: ^3.2.2
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  vibration: ^3.1.4
  fl_chart: ^0.66.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  uuid: ^4.5.2
  shimmer: ^3.0.0
  share_plus: ^12.0.1
  connectivity_plus: ^6.1.4
  device_info_plus: ^12.3.0
  package_info_plus: ^8.3.1
  image_picker: ^1.2.1
  timeago: ^3.7.1
  file_picker: ^10.3.7
  flutter_keyboard_visibility: ^6.0.0
  flutter_typeahead: ^5.2.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  youtube_player_flutter: ^9.0.1
  supabase_flutter: ^2.12.0
  google_maps_flutter: ^2.14.2
  record: ^6.2.1
  audioplayers: ^6.6.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#10141C"
    theme_color: "#8CCBFF"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  color_dark: "#10141C"
  image_dark: assets/logo.png
  android_12:
    image: assets/logo.png
    color: "#FFFFFF"
    image_dark: assets/logo.png
    color_dark: "#10141C"
  ios: true
  web: false

dependency_overrides:
  firebase_messaging_web:
    path: third_party/firebase_messaging_web_compat
