name: Flutter CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  retention-worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Test safe media retention
        run: node --experimental-strip-types --test supabase/tests/retention_media_worker_test.ts

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Configure Android SDK paths
        shell: python
        run: |
          import os
          from pathlib import Path
          Path("android/local.properties").write_text(
              "sdk.dir=" + os.environ["ANDROID_HOME"] + "\n"
              + "flutter.sdk=" + os.environ["FLUTTER_ROOT"] + "\n"
          )

      - name: Test Android attendance scheduler
        working-directory: android
        run: gradle :grace_attendance_background:testDebugUnitTest --no-daemon

  edge-function-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # These tests existed but nothing ran them, so they could drift out of
      # sync with the functions silently. That includes the R2 presigning
      # logic, where a wrong signature means every upload and every playback
      # URL is rejected.
      - name: Run Edge Function tests
        run: deno test supabase/functions/_shared/
